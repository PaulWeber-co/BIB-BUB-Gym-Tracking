<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Gym workout tracker with activity rings, progress trends and offline storage.">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="light">

    <!-- iOS PWA / Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Gym">
    <meta name="format-detection" content="telephone=no">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">

    <title>Gym</title>
    <link rel="stylesheet" href="css/style.css?v=3.1.0">
    <!-- runs before the body paints so the palette never flashes -->
    <script src="js/theme.js?v=3.1.0"></script>
</head>
<body>

<!-- ============================================================ -->
<!-- SUMMARY                                                      -->
<!-- ============================================================ -->
<section id="view-summary" class="view is-active" data-view="summary">
    <header class="nav-bar">
        <div class="nav-bar-inner">
            <h1 class="nav-title">Summary</h1>
            <div class="nav-right">
                <button class="nav-action" id="btn-open-settings" aria-label="Settings">
                    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.36.4.66.73.86.3.18.65.28 1 .28H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
                <div class="nav-date">
                    <span class="nav-date-day" id="summary-day"></span>
                    <span class="nav-date-month" id="summary-month"></span>
                </div>
            </div>
        </div>
    </header>
    <div class="view-body" id="summary-body"></div>
</section>

<!-- ============================================================ -->
<!-- WORKOUT / ROUTINES                                           -->
<!-- ============================================================ -->
<section id="view-routines" class="view" data-view="routines">
    <header class="nav-bar">
        <div class="nav-bar-inner">
            <h1 class="nav-title">Workout</h1>
            <button class="nav-action" id="btn-new-routine" aria-label="New routine">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
        </div>
    </header>
    <div class="view-body" id="routines-body"></div>
</section>

<!-- ============================================================ -->
<!-- HISTORY                                                      -->
<!-- ============================================================ -->
<section id="view-history" class="view" data-view="history">
    <header class="nav-bar">
        <div class="nav-bar-inner">
            <h1 class="nav-title">History</h1>
        </div>
    </header>
    <div class="view-body" id="history-body"></div>
</section>

<!-- ============================================================ -->
<!-- TRENDS                                                       -->
<!-- ============================================================ -->
<section id="view-trends" class="view" data-view="trends">
    <header class="nav-bar">
        <div class="nav-bar-inner">
            <h1 class="nav-title">Trends</h1>
        </div>
    </header>
    <div class="view-body" id="trends-body"></div>
</section>

<!-- ============================================================ -->
<!-- EXERCISES                                                    -->
<!-- ============================================================ -->
<section id="view-exercises" class="view" data-view="exercises">
    <header class="nav-bar">
        <div class="nav-bar-inner">
            <h1 class="nav-title">Exercises</h1>
            <button class="nav-action" id="btn-new-exercise" aria-label="New exercise">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
        </div>
    </header>
    <div class="view-body" id="exercises-body"></div>
</section>

<!-- ============================================================ -->
<!-- ACTIVE WORKOUT (full screen)                                 -->
<!-- ============================================================ -->
<section id="screen-workout" class="screen">
    <header class="screen-bar">
        <button class="bar-btn" id="btn-workout-cancel">Cancel</button>
        <div class="workout-headline">
            <span class="workout-clock" id="workout-clock">0:00</span>
            <span class="workout-subline" id="workout-subline">0 kg &middot; 0 sets</span>
        </div>
        <button class="bar-btn bar-btn-strong" id="btn-workout-finish">Finish</button>
    </header>
    <div class="screen-body" id="workout-body"></div>
    <div class="rest-bar" id="rest-bar" hidden>
        <div class="rest-progress" id="rest-progress"></div>
        <div class="rest-content">
            <button class="rest-adjust" data-rest-adjust="-15">&minus;15</button>
            <div class="rest-center">
                <span class="rest-label">Rest</span>
                <span class="rest-time" id="rest-time">1:30</span>
            </div>
            <button class="rest-adjust" data-rest-adjust="15">+15</button>
            <button class="rest-skip" id="btn-rest-skip" aria-label="Skip rest">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
    </div>
</section>

<!-- ============================================================ -->
<!-- ROUTINE EDITOR (full screen)                                 -->
<!-- ============================================================ -->
<section id="screen-routine-editor" class="screen">
    <header class="screen-bar">
        <button class="bar-btn" id="btn-routine-cancel">Cancel</button>
        <h2 class="screen-title" id="routine-editor-title">New Routine</h2>
        <button class="bar-btn bar-btn-strong" id="btn-routine-save">Save</button>
    </header>
    <div class="screen-body" id="routine-editor-body"></div>
</section>

<!-- ============================================================ -->
<!-- WORKOUT DETAIL (full screen)                                 -->
<!-- ============================================================ -->
<section id="screen-workout-detail" class="screen">
    <header class="screen-bar">
        <button class="bar-btn" id="btn-detail-back">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Back
        </button>
        <h2 class="screen-title">Workout</h2>
        <button class="bar-btn" id="btn-detail-menu" aria-label="More">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
    </header>
    <div class="screen-body" id="workout-detail-body"></div>
</section>

<!-- ============================================================ -->
<!-- EXERCISE DETAIL (full screen)                                -->
<!-- ============================================================ -->
<section id="screen-exercise-detail" class="screen">
    <header class="screen-bar">
        <button class="bar-btn" id="btn-exercise-detail-back">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Back
        </button>
        <h2 class="screen-title" id="exercise-detail-title">Exercise</h2>
        <button class="bar-btn" id="btn-exercise-detail-menu" aria-label="More">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
    </header>
    <div class="screen-body" id="exercise-detail-body"></div>
</section>

<!-- ============================================================ -->
<!-- TAB BAR                                                      -->
<!-- ============================================================ -->
<nav class="tab-bar" id="tab-bar">
    <button class="tab" data-tab="summary" aria-label="Summary">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><rect x="3" y="5" width="18" height="4"/><rect x="3" y="11" width="13" height="4"/><rect x="3" y="17" width="8" height="4"/></svg>
        <span>Summary</span>
    </button>
    <button class="tab" data-tab="routines" aria-label="Workout">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6"/><path d="M7 6.5v11"/><path d="M17 6.5v11"/><path d="M20 9v6"/><path d="M7 12h10"/></svg>
        <span>Workout</span>
    </button>
    <button class="tab" data-tab="history" aria-label="History">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><line x1="8" y1="2.5" x2="8" y2="6"/><line x1="16" y1="2.5" x2="16" y2="6"/></svg>
        <span>History</span>
    </button>
    <button class="tab" data-tab="trends" aria-label="Trends">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 16.5 9 10.5 13 14.5 21 6.5"/><polyline points="15 6.5 21 6.5 21 12.5"/></svg>
        <span>Trends</span>
    </button>
    <button class="tab" data-tab="exercises" aria-label="Exercises">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6.5" x2="20" y2="6.5"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="17.5" x2="20" y2="17.5"/><circle cx="4.5" cy="6.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="17.5" r="1.3" fill="currentColor" stroke="none"/></svg>
        <span>Exercises</span>
    </button>
</nav>

<!-- Mini bar for a workout that is running in the background -->
<div class="mini-workout" id="mini-workout" hidden>
    <div class="mini-workout-dot"></div>
    <div class="mini-workout-text">
        <span class="mini-workout-title">Workout in progress</span>
        <span class="mini-workout-time" id="mini-workout-time">0:00</span>
    </div>
    <span class="mini-workout-cta">Resume</span>
</div>

<!-- Sheets / dialogs / toasts are injected here -->
<div id="sheet-host"></div>
<div id="toast-host" class="toast-host"></div>

<script src="js/store.js?v=3.1.0"></script>
<script src="js/stats.js?v=3.1.0"></script>
<script src="js/charts.js?v=3.1.0"></script>
<script src="js/muscles.js?v=3.1.0"></script>
<script src="js/ui.js?v=3.1.0"></script>
<script src="js/nutrition.js?v=3.1.0"></script>
<script src="js/picker.js?v=3.1.0"></script>
<script src="js/workout.js?v=3.1.0"></script>
<script src="js/routines.js?v=3.1.0"></script>
<script src="js/history.js?v=3.1.0"></script>
<script src="js/trends.js?v=3.1.0"></script>
<script src="js/exercises.js?v=3.1.0"></script>
<script src="js/settings.js?v=3.1.0"></script>
<script src="js/summary.js?v=3.1.0"></script>
<script src="js/app.js?v=3.1.0"></script>
</body>
</html>
